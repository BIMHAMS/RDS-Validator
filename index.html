      <details class="geometry-settings"><summary>Geometriske toleranser</summary><label class="tolerance-label" for="positionToleranceMm">Posisjon (mm) <span class="help-tip" tabindex="0" title="Største tillatte avstand mellom sentrene av objektenes bounding boxes. Øk verdien for å godta større flytting." aria-label="Største tillatte avstand mellom sentrene av bounding boxes.">?</span></label><input id="positionToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="sizeToleranceMm">Størrelse, absolutt (mm) <span class="help-tip" tabindex="0" title="Største tillatte absolutte forskjell i én av bounding boxens dimensjoner, målt i millimeter." aria-label="Største tillatte absolutte dimensjonsforskjell i millimeter.">?</span></label><input id="sizeToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="relativeSizeTolerancePercent">Størrelse, relativ (%) <span class="help-tip" tabindex="0" title="Største tillatte dimensjonsforskjell relativt til den største dimensjonen i bounding boxene." aria-label="Største tillatte relative dimensjonsforskjell i prosent.">?</span></label><input id="relativeSizeTolerancePercent" type="number" min="0" max="100" step="0.1"><p class="muted tiny">Størrelsesavvik godtas innenfor den største av absolutt og relativ grense. Økte toleranser kan gi flere mulige kandidater; tvetydige geometritreff kobles ikke automatisk.</p></details>
