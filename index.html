    <section class="setup-panel panel">
      <div class="section-heading"><div><p class="eyebrow">KONTROLL</p><h2>Modellpar og felt</h2></div><span class="step-chip">01</span></div>
      <p class="muted small">Velg én modell i 3D-visningen. Når du legger til et par, finner Core API 2.1 forrige revisjon, leser referansen i et eget steg og laster den nye modellen tilbake. Når referansen er lagret, kan du prøve å vise gammel geometri samtidig med ny modell.</p>

      <button id="addModelPair" class="button ghost add-pair" type="button" disabled>+ Legg til modellpar</button>

      <p class="muted tiny">Historikken samles i mappen «RDS Validator - historikk» ved prosjektets rot, synlig i Connects filområde for prosjektmedlemmer. Godkjenninger og lokale rettelser lagres som separate JSON-filer; kilde-IFC endres ikke.</p>
      <div class="role-heading"><b>Egenskaper som brukes</b><button id="resetRoles" class="text-button" type="button">Automatisk</button></div>

      <label class="field-label" for="serialProperty">Løpenummer</label><select id="serialProperty" class="select role-select" disabled></select>

      <details class="ignore-options"><summary>Ignorer objekter</summary>

        <label class="toggle"><input id="excludeByRegex" type="checkbox" checked><span>Ignorer navn som samsvarer med regex</span></label>
        <label class="field-label" for="excludeRegex">Regex mot objektnavn / IFC-type</label>
        <textarea id="excludeRegex" class="regex-input" rows="4" spellcheck="false"></textarea>
        <p class="muted tiny">Delstrengtreff er standard: <code>Trench</code> treffer «Trench Bottom». Bruk <code>^</code> og <code>$</code> bare hvis hele navnet skal samsvare.</p>
