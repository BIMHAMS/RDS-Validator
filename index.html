  <header class="topbar">
    <div class="brand"><div class="brandmark">R</div><div><div class="brand-title-row"><h1>RDS Validator</h1><button id="helpButton" class="button ghost help-button" type="button" aria-haspopup="dialog" aria-controls="helpDialog">Hjelp</button></div><p>Trimble Connect-utvidelse</p></div></div>

    <section class="setup-panel panel">
      <div class="section-heading setup-heading"><div><p class="eyebrow">KONTROLL</p><h2>Innstillinger</h2></div><span class="step-chip">01</span><button id="toggleSetupPanel" class="button icon-button setup-panel-toggle" type="button" aria-expanded="true" aria-controls="setupPanelContent" title="Minimer innstillinger">›</button></div>
      <div id="setupPanelContent">
      <p class="muted small">Last inn modellene i 3D-visningen og trykk «Oppdater modeller». Navnelike modeller foreslås som par, men må bekreftes før validering. Du kan også legge til modellpar manuelt. Velg «Valider mot tidligere revisjon» for å hente forrige IFC-revisjon.</p>

      <div id="modelPairs" class="model-pairs"></div>
      <button id="addModelPair" class="button ghost add-pair" type="button" disabled>+ Legg til modellpar manuelt</button>
      <div class="project-history"><div><b>Prosjekthistorikk</b><small id="projectHistoryStatus">Ikke koblet til prosjektregisteret.</small></div><div class="project-history-actions"><button id="syncCorrectionsHistory" class="button ghost" type="button" disabled>Lagre rettelser</button><button id="connectProjectHistory" class="button ghost" type="button" disabled>Koble til prosjektlogg</button></div></div>
      <p class="muted tiny">Historikken samles i «RDS Validator - historikk» ved prosjektets rot, med én JSON-fil oppkalt etter IFC-filen. Connect beholder filversjoner. Eldre historikkfiler beholdes som arkiv; kilde-IFC endres ikke. Gjentatte like hendelser innen fem sekunder telles bare én gang.</p>
      <details id="matchingSettings" class="matching-settings" open><summary>Matching RDS</summary><div class="matching-settings-content"><div class="role-heading"><b>Egenskaper som brukes</b><button id="resetRoles" class="text-button" type="button">Automatisk</button></div>
      <p class="muted tiny">Oppdragsavhengige egenskaper kan velges. Nivåkontrollen leser feltene fra <code>2_RDS</code>.</p>
      <label class="field-label" for="tagProperty">RDS-tag <span class="help-tip" tabindex="0" title="Velg modell-egenskapen som brukes som primær RDS-identifikator." aria-label="Hjelp om RDS-tag-egenskap">?</span></label><select id="tagProperty" class="select role-select" disabled></select>
      <label class="field-label" for="serialProperty">Løpenummer <span class="help-tip" tabindex="0" title="Sekundær matchingnøkkel og kontroll av løpenummer." aria-label="Hjelp om løpenummer-egenskap">?</span></label><select id="serialProperty" class="select role-select" disabled></select>
      <label class="field-label" for="elementProperty">Element-ID <span class="help-tip" tabindex="0" title="Alternativ matchingnøkkel når RDS-tag eller GUID ikke gir et entydig treff." aria-label="Hjelp om Element-ID-egenskap">?</span></label><select id="elementProperty" class="select role-select" disabled></select>
      <details class="ignore-options"><summary>Ignorer objekter</summary>
        <label class="toggle"><input id="excludeIfcContainers" type="checkbox" checked><span>Ignorer IfcProject, IfcSite, IfcBuilding og IfcBuildingStorey</span><span class="help-tip" tabindex="0" title="Disse beholdertypene utelates fra sammenligning og resultatliste." aria-label="Hjelp om ignorering av IFC-beholdere">?</span></label>
        <label class="toggle"><input id="excludeByRegex" type="checkbox" checked><span>Ignorer navn som samsvarer med regex</span><span class="help-tip" tabindex="0" title="Objektnavn og IFC-type som treffer regex-uttrykket under, utelates fra matching." aria-label="Hjelp om regex-ignorering">?</span></label>
        <label class="field-label" for="excludeRegex">Regex mot objektnavn / IFC-type</label>
        <textarea id="excludeRegex" class="regex-input" rows="4" spellcheck="false"></textarea>

      </details>
      <details class="geometry-settings"><summary>Geometriske toleranser <span class="help-tip" tabindex="0" title="Geometri brukes som et senere matchingtrinn når egenskapsbasert matching ikke finner et sikkert treff." aria-label="Hjelp om geometriske toleranser">?</span></summary><label class="toggle"><input id="geometryLinking" type="checkbox" checked><span>Prøv geometrisk matching når RDS/GUID ikke gir treff <span class="help-tip" tabindex="0" title="Matching bruker IFC-type, plassering og bounding box som siste matchingtrinn; tvetydige kandidater kobles ikke automatisk." aria-label="Hjelp om geometrisk matching">?</span></span></label><label class="toggle"><input id="geometryConfirms" type="checkbox" checked><span>Godta lik bounding box som geometrisk bekreftelse <span class="help-tip" tabindex="0" title="Når RDS-tag og løpenummer stemmer, kan geometrien bekrefte treff selv om IFC GUID er ulik." aria-label="Hjelp om geometrisk bekreftelse">?</span></span></label><label class="tolerance-label" for="positionToleranceMm">Posisjon (mm) <span class="help-tip" tabindex="0" title="Største tillatte avstand mellom sentrene av objektenes bounding boxes. Øk verdien for å godta større flytting." aria-label="Største tillatte avstand mellom sentrene av bounding boxes.">?</span></label><input id="positionToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="sizeToleranceMm">Størrelse, absolutt (mm) <span class="help-tip" tabindex="0" title="Største tillatte absolutte forskjell i én av bounding boxens dimensjoner, målt i millimeter." aria-label="Største tillatte absolutte dimensjonsforskjell i millimeter.">?</span></label><input id="sizeToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="relativeSizeTolerancePercent">Størrelse, relativ (%) <span class="help-tip" tabindex="0" title="Største tillatte dimensjonsforskjell relativt til den største dimensjonen i bounding boxene." aria-label="Største tillatte relative dimensjonsforskjell i prosent.">?</span></label><input id="relativeSizeTolerancePercent" type="number" min="0" max="100" step="0.1"><p class="muted tiny">Størrelsesavvik godtas innenfor den største av absolutt og relativ grense. Økte toleranser kan gi flere mulige kandidater; tvetydige geometritreff kobles ikke automatisk.</p></details>
      </div></details>
      <label class="toggle"><input id="colorModels" type="checkbox" checked><span>Farg referanse rød og ny modell grønn</span></label>
