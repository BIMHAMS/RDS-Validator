  <header class="topbar">
    <div class="brand"><div class="brandmark">R</div><div><h1>RDS Validator</h1><p>Trimble Connect-utvidelse</p></div></div>
    <div class="top-actions"><span class="version-badge" title="Versjon">${Eo}</span><span id="connection" class="connection"><i></i> Kobler til Connect …</span><button id="refreshModels" class="button ghost" disabled>Oppdater modeller</button></div>
  </header>
  <main class="app-shell">
    <section class="setup-panel panel">
      <div class="section-heading"><div><p class="eyebrow">KONTROLL</p><h2>Modellpar og felt</h2></div><span class="step-chip">01</span></div>
      <p class="muted small">Velg én modell i 3D-visningen. Når du legger til et par, finner Core API 2.1 forrige revisjon, leser referansen i et eget steg og laster den nye modellen tilbake. Når referansen er lagret, kan du prøve å vise gammel geometri samtidig med ny modell.</p>
      <div id="modelPairs" class="model-pairs"></div>
      <button id="addModelPair" class="button ghost add-pair" type="button" disabled>+ Legg til modellpar</button>
      <div class="project-history"><div><b>Prosjekthistorikk</b><small id="projectHistoryStatus">Ikke koblet til prosjektregisteret.</small></div><button id="connectProjectHistory" class="button ghost" type="button" disabled>Koble til prosjektlogg</button></div>
      <p class="muted tiny">Når du kobler til, opprettes ved behov mappen «RDS Validator - historikk» ved siden av valgt modell i Connect-prosjektet. Godkjenninger og lokale rettelser lagres som separate historikkfiler; kilde-IFC endres ikke.</p>
      <div class="role-heading"><b>Egenskaper som brukes</b><button id="resetRoles" class="text-button" type="button">Automatisk</button></div>
      <p class="muted tiny">Oppdragsavhengige egenskaper kan velges. Nivåkontrollen leser feltene fra <code>2_RDS</code>.</p>
      <label class="field-label" for="tagProperty">RDS-tag</label><select id="tagProperty" class="select role-select" disabled></select>
      <label class="field-label" for="serialProperty">Løpenummer</label><select id="serialProperty" class="select role-select" disabled></select>
      <label class="field-label" for="elementProperty">Element-ID</label><select id="elementProperty" class="select role-select" disabled></select>
      <details class="ignore-options"><summary>Ignorer objekter</summary>
        <label class="toggle"><input id="excludeIfcContainers" type="checkbox" checked><span>Ignorer IfcProject, IfcSite, IfcBuilding og IfcBuildingStorey</span></label>
        <label class="toggle"><input id="excludeByRegex" type="checkbox" checked><span>Ignorer navn som samsvarer med regex</span></label>
        <label class="field-label" for="excludeRegex">Regex mot objektnavn / IFC-type</label>
        <textarea id="excludeRegex" class="regex-input" rows="4" spellcheck="false"></textarea>
        <p class="muted tiny">Delstrengtreff er standard: <code>Trench</code> treffer «Trench Bottom». Bruk <code>^</code> og <code>$</code> bare hvis hele navnet skal samsvare.</p>
        <p id="regexError" class="regex-error hidden">Ugyldig regex. Rett uttrykket før validering.</p>
      </details>
      <label class="toggle"><input id="geometryLinking" type="checkbox" checked><span>Prøv geometrisk matching når RDS/GUID ikke gir treff</span></label>
      <label class="toggle"><input id="geometryConfirms" type="checkbox" checked><span>Godta lik bounding box som geometrisk bekreftelse</span></label>
      <details class="geometry-settings"><summary>Geometriske toleranser</summary><label class="tolerance-label" for="positionToleranceMm">Posisjon (mm) <span class="help-tip" tabindex="0" title="Største tillatte avstand mellom sentrene av objektenes bounding boxes. Øk verdien for å godta større flytting." aria-label="Største tillatte avstand mellom sentrene av bounding boxes.">?</span></label><input id="positionToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="sizeToleranceMm">Størrelse, absolutt (mm) <span class="help-tip" tabindex="0" title="Største tillatte absolutte forskjell i én av bounding boxens dimensjoner, målt i millimeter." aria-label="Største tillatte absolutte dimensjonsforskjell i millimeter.">?</span></label><input id="sizeToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="relativeSizeTolerancePercent">Størrelse, relativ (%) <span class="help-tip" tabindex="0" title="Største tillatte dimensjonsforskjell relativt til den største dimensjonen i bounding boxene." aria-label="Største tillatte relative dimensjonsforskjell i prosent.">?</span></label><input id="relativeSizeTolerancePercent" type="number" min="0" max="100" step="0.1"><p class="muted tiny">Størrelsesavvik godtas innenfor den største av absolutt og relativ grense. Økte toleranser kan gi flere mulige kandidater; tvetydige geometritreff kobles ikke automatisk.</p></details>
      <label class="toggle"><input id="colorModels" type="checkbox" checked><span>Farg referanse rød og ny modell grønn</span></label>
      <button id="runValidation" class="button primary" disabled><span>▶</span> Kjør validering</button>
      <div class="setup-actions">
        <button id="clearResults" class="button ghost" type="button">Nullstill</button>
        <label class="button ghost file-button">Last kontroll<input id="loadControl" type="file" accept=".json,application/json" hidden></label>
        <button id="saveControl" class="button ghost" type="button">Lagre kontroll</button>
      </div>
      <div class="privacy-note"><span>▣</span><p>Modellobjekter leses via Connect Viewer API. Connect-token brukes bare for aktivt prosjektregister og filversjoner, og lagres ikke. Bare registerhendelser lastes opp – aldri IFC-filer.</p></div>
    </section>

    <section class="results-panel panel">
      <div class="section-heading results-heading"><div><p class="eyebrow">RESULTAT</p><h2>Avklaringer</h2></div><div class="result-actions"><button id="exportBcf" class="button ghost" disabled>Eksporter BCF 2.1</button><button id="exportCorrections" class="button ghost" disabled>Rettelser JSON</button><button id="exportCsv" class="button ghost" disabled>Eksport CSV</button><button id="saveReport" class="button report" disabled>Lagre rapport</button></div></div>
      <div id="progressCard" class="progress-card empty"><div class="progress-copy"><b id="progressTitle">Koble til Trimble Connect</b><span id="progressText">Åpne utvidelsen fra 3D Viewer i prosjektet.</span></div><div class="progress-track"><span id="progressFill"></span></div></div>
