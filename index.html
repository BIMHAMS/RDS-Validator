  <header class="topbar">
    <div class="brand"><div class="brandmark">R</div><div><div class="brand-title-row"><h1>RDS Validator</h1><button id="helpButton" class="button ghost help-button" type="button" aria-haspopup="dialog" aria-controls="helpDialog">Hjelp</button></div><p>Trimble Connect-utvidelse</p></div></div>
    <div class="top-actions"><span class="version-badge" title="Versjon">${hs}</span><span id="connection" class="connection"><i></i> Kobler til Connect …</span><label class="toggle refresh-history-toggle" title="Hent forrige IFC-revisjon for hver innlastede modell og lagre en midlertidig kopi i prosjektmappen."><input id="validatePreviousRevisions" type="checkbox"><span>Valider mot tidligere revisjon</span></label><button id="refreshModels" class="button ghost" disabled>Oppdater modeller</button></div>

  <nav id="workspaceTabs" class="workspace-tabs" aria-label="Validatorarbeidsflyt"><button class="workspace-tab active" type="button" data-workspace="revision">Revisjonskontroll</button><button class="workspace-tab" type="button" data-workspace="subvalidation">Sub-validering</button></nav>
  <main id="revisionWorkspace" class="app-shell">
    <section class="setup-panel panel">
      <div class="section-heading setup-heading"><div><p class="eyebrow">KONTROLL</p><h2>Innstillinger</h2></div><span class="step-chip">01</span><button id="toggleSetupPanel" class="button icon-button setup-panel-toggle" type="button" aria-expanded="true" aria-controls="setupPanelContent" title="Minimer innstillinger">›</button></div>
      <div id="setupPanelContent">
      <p class="muted small">Last inn modellene i 3D-visningen og trykk «Oppdater modeller». Navnelike modeller foreslås som par, men må bekreftes før validering. Du kan også legge til modellpar manuelt. Velg «Valider mot tidligere revisjon» for å hente forrige IFC-revisjon.</p>
      <div id="modelPairSuggestions" class="model-pair-suggestions hidden"></div>
      <div id="modelPairs" class="model-pairs"></div>
      <button id="addModelPair" class="button ghost add-pair" type="button" disabled>+ Legg til modellpar manuelt</button>
      <div class="project-history"><div><b>Prosjekthistorikk</b><small id="projectHistoryStatus">Ikke koblet til prosjektregisteret.</small></div><div class="project-history-actions"><button id="syncCorrectionsHistory" class="button ghost" type="button" disabled>Lagre rettelser</button><button id="connectProjectHistory" class="button ghost" type="button" disabled>Koble til prosjektlogg</button></div></div>
      <p class="muted tiny">Historikken samles i «RDS Validator - historikk» ved prosjektets rot, med én JSON-fil oppkalt etter IFC-filen. Connect beholder filversjoner. Eldre historikkfiler beholdes som arkiv; kilde-IFC endres ikke. Gjentatte like hendelser innen fem sekunder telles bare én gang.</p>
      <details id="matchingSettings" class="matching-settings" open><summary>Matching RDS</summary><div class="matching-settings-content"><div class="role-heading"><b>Egenskaper som brukes</b><button id="resetRoles" class="text-button" type="button">Automatisk</button></div>
      <p class="muted tiny">Oppdragsavhengige egenskaper kan velges. Nivåkontrollen leser feltene fra <code>2_RDS</code>.</p>
      <label class="field-label" for="tagProperty">RDS-tag <span class="help-tip" tabindex="0" title="Velg modell-egenskapen som brukes som primær RDS-identifikator." aria-label="Hjelp om RDS-tag-egenskap">?</span></label><select id="tagProperty" class="select role-select" disabled></select>
      <label class="field-label" for="serialProperty">Løpenummer <span class="help-tip" tabindex="0" title="Sekundær matchingnøkkel og kontroll av løpenummer." aria-label="Hjelp om løpenummer-egenskap">?</span></label><select id="serialProperty" class="select role-select" disabled></select>
      <label class="field-label" for="elementProperty">Element-ID <span class="help-tip" tabindex="0" title="Alternativ matchingnøkkel når RDS-tag eller GUID ikke gir et entydig treff." aria-label="Hjelp om Element-ID-egenskap">?</span></label><select id="elementProperty" class="select role-select" disabled></select>
      <details class="ignore-options"><summary>Ignorer objekter</summary>
        <label class="toggle"><input id="excludeIfcContainers" type="checkbox" checked><span>Ignorer IfcProject, IfcSite, IfcBuilding og IfcBuildingStorey</span><span class="help-tip" tabindex="0" title="Disse beholdertypene utelates fra sammenligning og resultatliste." aria-label="Hjelp om ignorering av IFC-beholdere">?</span></label>
        <label class="toggle"><input id="excludeByRegex" type="checkbox" checked><span>Ignorer navn som samsvarer med regex</span><span class="help-tip" tabindex="0" title="Objektnavn og IFC-type som treffer regex-uttrykket under, utelates fra matching." aria-label="Hjelp om regex-ignorering">?</span></label>
        <label class="field-label" for="excludeRegex">Regex mot objektnavn / IFC-type</label>
        <textarea id="excludeRegex" class="regex-input" rows="4" spellcheck="false"></textarea>
        <p class="muted tiny">Delstrengtreff er standard: <code>Trench</code> treffer «Trench Bottom». Bruk <code>^</code> og <code>$</code> bare hvis hele navnet skal samsvare.</p>
        <p id="regexError" class="regex-error hidden">Ugyldig regex. Rett uttrykket før validering.</p>
      </details>
      <details class="geometry-settings"><summary>Geometriske toleranser <span class="help-tip" tabindex="0" title="Geometri brukes som et senere matchingtrinn når egenskapsbasert matching ikke finner et sikkert treff." aria-label="Hjelp om geometriske toleranser">?</span></summary><label class="toggle"><input id="geometryLinking" type="checkbox" checked><span>Prøv geometrisk matching når RDS/GUID ikke gir treff <span class="help-tip" tabindex="0" title="Matching bruker IFC-type, plassering og bounding box som siste matchingtrinn; tvetydige kandidater kobles ikke automatisk." aria-label="Hjelp om geometrisk matching">?</span></span></label><label class="toggle"><input id="geometryConfirms" type="checkbox" checked><span>Godta lik bounding box som geometrisk bekreftelse <span class="help-tip" tabindex="0" title="Når RDS-tag og løpenummer stemmer, kan geometrien bekrefte treff selv om IFC GUID er ulik." aria-label="Hjelp om geometrisk bekreftelse">?</span></span></label><label class="tolerance-label" for="positionToleranceMm">Posisjon (mm) <span class="help-tip" tabindex="0" title="Største tillatte avstand mellom sentrene av objektenes bounding boxes. Øk verdien for å godta større flytting." aria-label="Største tillatte avstand mellom sentrene av bounding boxes.">?</span></label><input id="positionToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="sizeToleranceMm">Størrelse, absolutt (mm) <span class="help-tip" tabindex="0" title="Største tillatte absolutte forskjell i én av bounding boxens dimensjoner, målt i millimeter." aria-label="Største tillatte absolutte dimensjonsforskjell i millimeter.">?</span></label><input id="sizeToleranceMm" type="number" min="0" max="100000" step="1"><label class="tolerance-label" for="relativeSizeTolerancePercent">Størrelse, relativ (%) <span class="help-tip" tabindex="0" title="Største tillatte dimensjonsforskjell relativt til den største dimensjonen i bounding boxene." aria-label="Største tillatte relative dimensjonsforskjell i prosent.">?</span></label><input id="relativeSizeTolerancePercent" type="number" min="0" max="100" step="0.1"><p class="muted tiny">Størrelsesavvik godtas innenfor den største av absolutt og relativ grense. Økte toleranser kan gi flere mulige kandidater; tvetydige geometritreff kobles ikke automatisk.</p></details>
      </div></details>
      <label class="toggle"><input id="colorModels" type="checkbox" checked><span>Farg referanse rød og ny modell grønn</span></label>
      <div class="setup-actions">
        <button id="runValidation" class="button primary" disabled><span>▶</span> Kjør validering</button>
        <div class="reset-actions">
          <button id="clearResults" class="button ghost" type="button">Avslutt og nullstill</button>
          <button id="resetResultsOnly" class="button ghost" type="button" title="Nullstill bare resultatene; behold modeller, godkjenninger, rettelser og historikkfiler.">Nullstill</button>
        </div>
        <div class="control-file-actions">
          <label class="button ghost file-button">Last kontroll<input id="loadControl" type="file" accept=".json,application/json" hidden></label>
          <button id="saveControl" class="button ghost" type="button">Lagre kontroll</button>
        </div>
      </div>
      <div class="privacy-note"><span>▣</span><p>Modellobjekter leses via Connect Viewer API. Connect-token brukes bare for aktivt prosjektregister og filversjoner, og lagres ikke. Bare registerhendelser lastes opp – aldri IFC-filer.</p></div>
      </div>
    </section>

    <section class="results-panel panel">
      <div class="section-heading results-heading"><div><p class="eyebrow">RESULTAT</p><h2>Avklaringer</h2></div><div class="result-actions"><button id="exportBcf" class="button ghost" disabled>Eksporter BCF 2.1</button><button id="exportCorrections" class="button ghost" disabled>Rettelser JSON</button><button id="exportCsv" class="button ghost" disabled>Eksport CSV</button><button id="saveReport" class="button report" disabled>Lagre rapport</button></div></div>
      <div id="progressCard" class="progress-card empty"><div class="progress-copy"><b id="progressTitle">Koble til Trimble Connect</b><span id="progressText">Åpne utvidelsen fra 3D Viewer i prosjektet.</span></div><div class="progress-track"><span id="progressFill"></span></div></div>
      <div id="staleBanner" class="stale-banner hidden">Modellvalg eller egenskapsvalg er endret. Kjør valideringen på nytt før du bruker resultatet.</div>
      <div id="ignoredRdsWarning" class="ignored-rds-warning hidden" role="alert"></div>
      <details id="bcfStatusPicker" class="bcf-status-panel"><summary>Velg statuser som skal med i BCF</summary><div class="bcf-status-actions"><button type="button" class="text-button" data-bcf-status-action="all">Velg alle</button><button type="button" class="text-button" data-bcf-status-action="none">Fjern alle</button></div><div id="bcfStatusChoices" class="bcf-status-choices"><span class="muted tiny">Kjør valideringen for å velge statuser.</span></div></details>
      <div class="tabs" id="tabs"><button class="tab active" data-filter="todo">Til oppfølging <span id="todoCount">0</span></button><button class="tab" data-filter="all">Alle <span id="allCount">0</span></button><button class="tab" data-filter="ignored">Ignorert <span id="ignoredCount">0</span></button></div>
      <div class="table-tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Søk i RDS, løpenummer, ID, objekt eller årsak"></label><select id="modelPairFilter" class="select table-filter" aria-label="Filtrer på modellpar"><option value="">Alle modellpar</option></select><select id="statusFilter" class="select table-filter" aria-label="Filtrer på status"><option value="">Alle statuser</option></select><details id="objectNameFilter" class="object-name-filter table-filter"><summary id="objectNameSummary">Objekt</summary><div class="object-name-menu"><div class="object-name-actions"><span>Vis valgte objekter</span><button id="clearObjectNameFilter" class="text-button" type="button">Fjern valg</button></div><div id="objectNameChoices" class="object-name-choices"><span class="muted tiny">Kjør valideringen først.</span></div></div></details><button id="approveSelected" class="button approve" disabled>Godkjenn valgte</button><button id="unapproveSelected" class="button ghost" disabled>Fjern godkjenning</button><button id="clearSelection" class="button icon-button" title="Fjern valg">×</button></div>
      <div class="table-scroll"><table id="resultsTable"><thead><tr><th class="check-col"><input id="selectVisible" type="checkbox" aria-label="Velg alle synlige rader"></th><th data-sort="status"><button class="sort-button" type="button" data-sort="status">Status <span class="sort-indicator">↑</span></button><small id="statusVisibleCount" class="status-visible-count">0 aktive</small></th><th data-sort="tag"><button class="sort-button" type="button" data-sort="tag">RDS-tag <span class="sort-indicator"></span></button></th><th data-sort="serial"><button class="sort-button" type="button" data-sort="serial">Løpenummer <span class="sort-indicator"></span></button></th><th data-sort="element"><button class="sort-button" type="button" data-sort="element">Element-ID <span class="sort-indicator"></span></button></th><th data-sort="object"><button class="sort-button" type="button" data-sort="object">Objekt <span class="sort-indicator"></span></button></th><th data-sort="geometry"><button class="sort-button" type="button" data-sort="geometry">Geometri <span class="sort-indicator"></span></button></th><th data-sort="code"><button class="sort-button" type="button" data-sort="code">Kode <span class="sort-indicator"></span></button></th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty-row">Ingen valideringsresultater ennå.</td></tr></tbody></table></div>
      <div class="result-footer"><span id="rowCount">0 rader</span><span>Velg en rad for detaljer og 3D-markering.</span></div>
    </section>

    <aside id="detailPanel" class="detail-panel panel">
      <div class="section-heading detail-heading"><div><p class="eyebrow">VALGT OBJEKT</p><h2>Detaljer</h2></div><button id="toggleDetailPanel" class="button icon-button detail-panel-toggle" type="button" aria-expanded="true" aria-controls="detailPanelContent" title="Minimer detaljer">›</button><button id="zoomSelected" class="button icon-button" title="Zoom til objekt" disabled>⌕</button></div>
      <div id="detailPanelContent" class="detail-panel-content"><div id="detailContent" class="detail-content"><div class="detail-empty"><div>◇</div><b>Ingen rad valgt</b><p>Velg et objekt i resultatlisten for å se kontrollgrunnlag, geometri og egenskaper.</p></div></div></div>
    </aside>
  </main>
  <section id="subvalidationWorkspace" class="subvalidation-workspace panel hidden" aria-label="Sub-validering">
    <div class="section-heading"><div><p class="eyebrow">EXCEL-BASERT KONTROLL</p><h2>Sub-validering av 2_RDS</h2></div><span class="step-chip">02</span></div>
    <p class="muted small">Velg modellene som skal kontrolleres, last opp den autoritative RDS-arbeidsboken, og tilpass property-stiene per modell. Arbeidsboken leses lokalt i nettleseren; den sendes ikke til Connect.</p>
    <div class="subvalidation-source"><label class="field-label" for="subvalidationWorkbook">RDS-masterarbeidsbok (.xlsx)</label><input id="subvalidationWorkbook" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><div id="subvalidationWorkbookStatus" class="muted tiny">Ingen arbeidsbok lastet. Oppslagsverdier hardkodes ikke.</div><div id="subvalidationWorkbookWarnings" class="subvalidation-warnings hidden" role="status"></div></div>
    <div class="subvalidation-model-picker"><div class="role-heading"><b>Modeller som kontrolleres</b><button id="refreshSubvalidationModels" class="text-button" type="button">Oppdater liste</button></div><p class="muted tiny">Bare modeller du velger her blir kontrollert; revisjoner som er lastet automatisk tas ikke med uten valg.</p><div id="subvalidationModels" class="subvalidation-models"><span class="muted tiny">Last inn modeller i Connect først.</span></div></div>
    <div class="subvalidation-model-config"><div class="role-heading"><b>Forhåndsoppsett per modell</b><span class="muted tiny">Endringene lagres lokalt per modell.</span></div><div id="subvalidationModelSettings"><p class="muted tiny">Velg en eller flere modeller for å redigere egenskapskoblingene.</p></div></div>
    <div class="subvalidation-actions"><button id="runSubvalidation" class="button primary" type="button" disabled>▶ Kjør sub-validering</button><span id="subvalidationRunStatus" class="muted small">Last arbeidsboken og velg modeller for å starte.</span></div>
    <div id="subvalidationResults" class="subvalidation-results"><div class="subvalidation-empty">Resultatene fra sub-valideringen vises her. Eksisterende revisjonskontroll påvirkes ikke.</div></div>
  </section>
