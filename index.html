      <label class="field-label" for="serialProperty">Løpenummer <span class="help-tip" tabindex="0" title="Sekundær matchingnøkkel og kontroll av løpenummer." aria-label="Hjelp om løpenummer-egenskap">?</span></label><select id="serialProperty" class="select role-select" disabled></select>
      <label class="field-label" for="elementProperty">Element-ID <span class="help-tip" tabindex="0" title="Alternativ matchingnøkkel når RDS-tag eller GUID ikke gir et entydig treff." aria-label="Hjelp om Element-ID-egenskap">?</span></label><select id="elementProperty" class="select role-select" disabled></select>

        <label class="toggle"><input id="excludeIfcContainers" type="checkbox" checked><span>Ignorer IfcProject, IfcSite, IfcBuilding og IfcBuildingStorey</span><span class="help-tip" tabindex="0" title="Disse beholdertypene utelates fra sammenligning og resultatliste." aria-label="Hjelp om ignorering av IFC-beholdere">?</span></label>
        <label class="toggle"><input id="excludeByRegex" type="checkbox" checked><span>Ignorer navn som samsvarer med regex</span><span class="help-tip" tabindex="0" title="Objektnavn og IFC-type som treffer regex-uttrykket under, utelates fra matching." aria-label="Hjelp om regex-ignorering">?</span></label>

atte relative dimensjonsforskjell i prosent.">?</span></label><input id="relativeSizeTolerancePercent" type="number" min="0" max="100" step="0.1"><p class="muted tiny">Størrelsesavvik godtas innenfor den største av absolutt og relativ grense. Økte toleranser kan gi flere mulige kandidater; tvetydige geometritreff kobles ikke automatisk.</p></details>
